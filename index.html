<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KenLiu 劉炳祥 | AI 驅動全端工程師 · 數據分析師</title>
  <meta name="description" content="KenLiu 劉炳祥 — AI 驅動全端工程師，熟練 Claude、OpenAI Codex、Gemini CLI，專注財務分析系統與自動化平台開發。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="ai-projects-data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ken-components.jsx"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans TC', 'Space Grotesk', sans-serif;
      background: #080818;
      color: #f1f5f9;
      overflow-x: hidden;
      line-height: 1.7;
    }
    #root { min-height: 100vh; }

    @keyframes kenFadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes kenFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes kenPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(1.25); }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #080818; }
    ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 3px; }

    ::selection { background: rgba(124,58,237,0.32); }

    /* Responsive: hide nav links on mobile */
    @media (max-width: 640px) {
      .ken-nav-links { display: none !important; }
    }

    /* About grid responsive */
    @media (max-width: 720px) {
      .ken-about-grid { grid-template-columns: 1fr !important; }
    }
  </style>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
      <rect width="80" height="56" fill="#080818"/>
      <text x="14" y="32" font-size="22" font-family="sans-serif" font-weight="700" fill="url(#g)">KL.</text>
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a78bfa"/>
          <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
      </defs>
      <rect x="8" y="38" width="64" height="1" fill="rgba(139,92,246,0.3)"/>
      <circle cx="64" cy="18" r="8" fill="none" stroke="#7c3aed" stroke-width="1"/>
      <circle cx="64" cy="18" r="3" fill="#22d3ee" opacity="0.7"/>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      KenNav, KenHero, KenAbout, KenSkills,
      KenExperience, KenPortfolio, KenAIProjects, KenPowerBI, KenContact, KenFooter
    } = window;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "#7c3aed",
      "showParticles": true,
      "showExperience": true
    }/*EDITMODE-END*/;

    const App = () => {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const a = t.accentColor;

      return (
        <>
          <KenNav accentColor={a} />
          <main>
            <KenHero      accentColor={a} showParticles={t.showParticles} />
            <KenAbout />
            <KenSkills    accentColor={a} />
            {t.showExperience && <KenExperience />}
            <KenPortfolio accentColor={a} />
            <KenAIProjects accentColor={a} />
            <KenPowerBI   accentColor={a} />
            <KenContact   accentColor={a} />
          </main>
          <KenFooter />

          <TweaksPanel>
            <TweakSection label="主題色彩" />
            <TweakColor
              label="強調色"
              value={a}
              options={['#7c3aed','#22d3ee','#10b981','#f59e0b','#ec4899']}
              onChange={v => setTweak('accentColor', v)}
            />
            <TweakSection label="顯示設定" />
            <TweakToggle
              label="粒子網絡動畫"
              value={t.showParticles}
              onChange={v => setTweak('showParticles', v)}
            />
            <TweakToggle
              label="顯示經歷區塊"
              value={t.showExperience}
              onChange={v => setTweak('showExperience', v)}
            />
          </TweaksPanel>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
